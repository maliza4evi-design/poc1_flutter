publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  google_nearby_connections: ^0.4.0
  permission_handler: ^11.3.0
  provider: ^6.1.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  logging: ^1.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mockito: ^5.4.4
